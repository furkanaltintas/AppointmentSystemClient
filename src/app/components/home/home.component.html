<div class="mt-3 d-flex justify-content-between align-items-center">
  <h3 class="text-white">Patient Appointment Table</h3>
</div>

<div class="mt-2">
  <div class="row">
      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12 mt-1">
          <label class="text-white">Department</label>
          <select (change)="getAllDoctor()" name="department" [(ngModel)]="selectedDepartmentValue" class="form-control">
              <option [value]="0">Select...</option>
              @for(department of departments;track department){
                  <option [value]="department.id">
                      {{department.name}}
                  </option>
              }
          </select>
      </div>

      @if(selectedDepartmentValue > 0){
          <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12 mt-1">
              <label class="text-white">Doctor</label>
              @if(doctors.length === 0){
                  <input class="form-control" value="There is not doctor this department" disabled>
              }@else {
                  <select (change)="getAllAppointments()" name="doctor" [(ngModel)]="selectedDoctorId" class="form-control">
                      @for(doctor of doctors;track doctor){
                          <option [value]="doctor.id">
                              {{doctor.fullName}}
                          </option>
                      }
                  </select>
              }
          </div>
      }

      <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12 mt-1">
        <label class="text-white">Saat</label>
        <input class="form-control" value="{{currentTime}}" disabled>
    </div>
  </div>

  @if(selectedDoctorId){
      <div class="mt-2">
          <dx-scheduler
              [dataSource]="appointments"
              currentView="week"
              [startDayHour]="9"
              [endDayHour]="20"
              [showAllDayPanel]="false"
              textExpr="title"
              (onAppointmentFormOpening)="onAppointmentFormOpening($event)"
              (onAppointmentDeleted)="onAppointmentDeleted($event)"
              (onAppointmentDeleting)="onAppointmentDeleting($event)"
              (onAppointmentUpdating)="onAppointmentUpdating($event)"
              >
          </dx-scheduler>
      </div>
  }
</div>

<!-- Create Modal -->
<div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Create Appointment Form</h1>
        <button type="button" #createModalCloseBtn class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form #createForm="ngForm" formValidate autocomplete="off" (ngSubmit)="create(createForm)">
          <div class="modal-body">
              <div class="form-group text-center mt-2">
                  <span class="">
                      {{createModel.startDate}} -
                      {{createModel.endDate}}
                      <hr>
                  </span>
              </div>

              <div class="form-group mt-4">
                  <label>Identity Number</label>
                  <input type="text" [(ngModel)]="createModel.identityNumber" name="identityNumber" class="form-control" required minlength="11" maxlength="11" (change)="getPatient()">
                  <div class="invalid-feedback"></div>
              </div>

              <div class="form-group mt-2">
                  <label>First Name</label>
                  <input type="text" [(ngModel)]="createModel.firstName" name="firstName" class="form-control" required minlength="3" [disabled]="isInputDisabled">
                  <div class="invalid-feedback"></div>
              </div>

              <div class="form-group mt-2">
                  <label>Last Name</label>
                  <input type="text" [(ngModel)]="createModel.lastName" name="lastName" class="form-control" required minlength="3" [disabled]="isInputDisabled">
                  <div class="invalid-feedback"></div>
              </div>

              <div class="form-group mt-2">
                  <label>City</label>
                  <input type="text" [(ngModel)]="createModel.city" name="city" class="form-control" required minlength="3" [disabled]="isInputDisabled">
                  <div class="invalid-feedback"></div>
              </div>

              <div class="form-group mt-2">
                  <label>Town</label>
                  <input type="text" [(ngModel)]="createModel.town" name="town" class="form-control" required minlength="3" [disabled]="isInputDisabled">
                  <div class="invalid-feedback"></div>
              </div>

              <div class="form-group mt-2">
                  <label>Full Address</label>
                  <textarea class="form-control" [(ngModel)]="createModel.fullAddress" name="fullAddress" required minlength="3" [disabled]="isInputDisabled"></textarea>
                  <div class="invalid-feedback"></div>
              </div>
          </div>
          <div class="modal-footer">
              <button type="submit" class="btn btn-dark w-100">
                  Create
              </button>
          </div>
      </form>
    </div>
  </div>
</div>
