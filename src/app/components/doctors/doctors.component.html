<div class="mt-2 d-flex justify-content-between align-items-center">
  <h3 class="text-white">Doctor Page</h3>
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
      <li class="breadcrumb-item active">
        <a routerLink="/doctors">Doctors</a>
      </li>
      <li class="breadcrumb-item">Add</li>
    </ol>
  </nav>
</div>

<div class="mt-1">
  <div class="form-group">
    <div class="row">
      <div class="col-xl-9 col-lg-8 col-md-6 col-sm-12 col-12">
        <button class="btn btn-dark">
          <i class="fa-solid fa-plus me-2"></i>
          <span>Add Doctor</span>
        </button>
      </div>

      <div
        class="col-xl-3 col-lg-4 col-md-6 col-sm-12 col-12 position-relative"
      >
        <input
          type="search"
          class="form-control"
          placeholder="Search doctor..."
        />
        <i class="fa-solid fa-magnifying-glass search"></i>
      </div>
    </div>
  </div>

  <div class="form-group mt-2">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>#</th>
          <th>Full Name</th>
          <th>Department</th>
          <th>Operations</th>
        </tr>
      </thead>
      <tbody>
        @for (doctor of doctors; track doctor) {
        <tr>
          <td>{{$index + 1}}</td>
          <td>{{doctor.fullName}}</td>
          <td>{{doctor.department.name}}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" title="Update">
              <i class="fa-solid fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" title="Delete">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>



<!-- Modal -->
<div class="modal fade" id="addModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Create Doctor</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form action="">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" ngModel name="firstName" class="form-control" required minlength="3">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" ngModel name="lastName" class="form-control" required minlength="3">
          </div>
          <div class="form-group">
            <label>Department</label>
            <select class="form-control" ngModel name="department">
              <option>Select...</option>
              <option></option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
