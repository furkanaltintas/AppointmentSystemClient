<div class="mt-2 d-flex justify-content-between align-items-center">
  <h3 class="text-white">Departments Page</h3>
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
      <li class="breadcrumb-item active">
        <a routerLink="/departments">Departments</a>
      </li>
      <li class="breadcrumb-item">Add</li>
    </ol>
  </nav>
</div>

<div class="mt-1">
  <div class="form-group">
    <div class="row">
      <div class="col-xl-9 col-lg-8 col-md-6 col-sm-12 col-12">
        <button data-bs-toggle="modal" data-bs-target="#createModal" class="btn btn-dark" class="btn btn-dark">
          <i class="fa-solid fa-plus me-2"></i>
          <span>Add Department</span>
        </button>
      </div>

      <div
        class="col-xl-3 col-lg-4 col-md-6 col-sm-12 col-12 position-relative"
      >
        <input
          type="search"
          class="form-control"
          placeholder="Search department..."
          [(ngModel)]="search"
        />
        <i class="fa-solid fa-magnifying-glass search"></i>
      </div>
    </div>
  </div>

  <div class="form-group mt-2">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Operations</th>
        </tr>
      </thead>
      <tbody>
        @for (department of departments | department : search; track department) {
        <tr>
          <td>{{$index + 1}}</td>
          <td>{{department.name}}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" title="Update">
              <i class="fa-solid fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" title="Delete">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>



<!-- Create Modal -->
<div class="modal fade" id="createModal">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="createModalLabel">Create Department Form</h5>
        <button type="button" #createModalCloseButton class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>
      <div class="modal-body">
        <form #createForm="ngForm" formValidate autocomplete="off" (ngSubmit)="create(createForm)">
          <div class="form-group">
            <label>Name</label>
            <input type="text" [(ngModel)]="createModel.name" name="name" class="form-control" required minlength="3">
            <div class="invalid-feedback"></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-dark w-100">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Update Modal -->
<div class="modal fade" id="updateModal">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="updateModalLabel">Update Department Form</h5>
        <button type="button" #updateModalCloseButton class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>
      <div class="modal-body">
        <form #updateForm="ngForm" formValidate autocomplete="off" (ngSubmit)="update(updateForm)">
          <div class="form-group">
            <label>Name</label>
            <input type="text" [(ngModel)]="updateModel.name" name="name" class="form-control" required minlength="3">
            <div class="invalid-feedback"></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-dark w-100">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
